name: Canonical Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, consolidation/ptdt-unified-canonical]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Compile Python modules
        run: python -m compileall -q engine src tests
      - name: Evidence and scientific tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect duplicate authority/provenance implementations
        shell: bash
        run: |
          set -euo pipefail
          evidence_count=$(grep -RIl --exclude-dir=.git --exclude='*.lock' 'class ProvenanceRecord' . | wc -l)
          graph_count=$(grep -RIl --exclude-dir=.git --exclude='*.lock' 'class EvidenceGraph' . | wc -l)
          if [ "$evidence_count" -ne 1 ]; then
            echo "Expected exactly one active ProvenanceRecord implementation; found $evidence_count"
            exit 1
          fi
          if [ "$graph_count" -ne 1 ]; then
            echo "Expected exactly one active EvidenceGraph implementation; found $graph_count"
            exit 1
          fi
      - name: Detect obsolete source-repository imports
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git -E 'Tri-County-River-Valley-Digital-Twin|Tri-State-River-Valley-Engineering-System|PTDT-v33' engine src tests 2>/dev/null; then
            echo "Obsolete source-repository dependency detected"
            exit 1
          fi
