name: Canonical Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, consolidation/ptdt-unified-canonical, feature/cinematic-runtime-core-fixes]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PTDT_REDIS_URL: redis://127.0.0.1:6379/0
      PTDT_WS_SHARED_SECRET: ci-test-secret
      PTDT_REQUIRE_REDIS: "true"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python runtime and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cinematic-runtime.txt
          python -m pip install usd-core
      - name: Compile Python modules
        run: python -m compileall -q engine src tests
      - name: Evidence, scientific, cinematic runtime, Redis, and OpenUSD tests
        run: python -m pytest -q
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-cinematic-runtime.txt || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Validate WebGPU runtime client syntax
        run: node --check public/js/webgpu_runtime.js
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: SceneState contract tests
        run: node --experimental-strip-types --test tests/scene/SceneState.test.ts

  webgpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Naga validator
        run: cargo install naga-cli --locked
      - name: Extract exact PTDT WGSL source
        shell: python
        run: |
          from pathlib import Path
          source = Path("src/gpu/FloodDepthCompute.ts").read_text(encoding="utf-8")
          marker = "export const FLOOD_DEPTH_COMPUTE_WGSL = /* wgsl */ `"
          start = source.index(marker) + len(marker)
          end = source.index("`;", start)
          Path("/tmp/PTDT_FloodDepthCompute.wgsl").write_text(source[start:end], encoding="utf-8")
      - name: Validate existing flood WGSL with Naga
        run: naga validate /tmp/PTDT_FloodDepthCompute.wgsl
      - name: Validate SceneState manifest WGSL with Naga
        run: naga validate src/shaders/sceneStateManifest.wgsl
      - name: Verify shader contract invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'texture_storage_2d<r32float, read>' src/gpu/FloodDepthCompute.ts
          grep -q 'texture_storage_2d<r32float, write>' src/gpu/FloodDepthCompute.ts
          grep -q '@workgroup_size(8, 8, 1)' src/gpu/FloodDepthCompute.ts
          grep -q 'fn validDepth' src/gpu/FloodDepthCompute.ts
          grep -q 'value == value' src/gpu/FloodDepthCompute.ts
          grep -q 'array<mat4x4<f32>>' src/shaders/sceneStateManifest.wgsl
          grep -q 'array<u32>' src/shaders/sceneStateManifest.wgsl
          grep -q 'transformStrideF32' src/shaders/sceneStateManifest.wgsl

  openusd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenUSD test tooling
        run: python -m pip install --upgrade pip pytest usd-core
      - name: OpenUSD SceneState round-trip
        run: python -m pytest -q tests/openusd/test_scene_roundtrip.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependency graph without rewriting lockfile
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Report package-lock drift
        shell: bash
        run: |
          if ! git diff --exit-code -- package-lock.json; then
            echo "WARNING: package.json and package-lock.json are currently out of sync."
            git diff --stat -- package-lock.json || true
          fi
      - name: Production dependency audit (omit dev / electron)
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit (report only; electron tooling often high)
        run: npm audit --audit-level=high || echo "WARN: full audit reported issues (non-blocking for electron tooling)"
      - name: Repository secret-pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='package-lock.json' --exclude='*.lock' \
            '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----)' .; then
            echo "Potential credential material detected in repository"
            exit 1
          fi

  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect duplicate authority/provenance implementations
        shell: bash
        run: |
          set -euo pipefail
          evidence_count=$(grep -RIl --exclude-dir=.git --exclude='*.lock' 'class ProvenanceRecord' src engine tests | wc -l)
          graph_count=$(grep -RIl --exclude-dir=.git --exclude='*.lock' 'class EvidenceGraph' src engine tests | wc -l)
          if [ "$evidence_count" -ne 1 ]; then
            echo "Expected exactly one active ProvenanceRecord implementation; found $evidence_count"
            exit 1
          fi
          if [ "$graph_count" -ne 1 ]; then
            echo "Expected exactly one active EvidenceGraph implementation; found $graph_count"
            exit 1
          fi
      - name: Detect obsolete source-repository imports
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git -E 'Tri-County-River-Valley-Digital-Twin|Tri-State-River-Valley-Engineering-System|PTDT-v33' engine src tests 2>/dev/null; then
            echo "Obsolete source-repository dependency detected"
            exit 1
          fi
