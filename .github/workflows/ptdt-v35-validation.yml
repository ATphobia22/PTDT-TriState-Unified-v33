name: PTDT v35 Validation

on:
  push:
    branches: [main, integration/ptdt-v35-main-consolidation]
  pull_request:
    branches: [main]

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Generate protobuf modules
        run: bash scripts/generate_spatial_proto.sh
      - name: Run PTDT v35 tests
        run: python -m pytest -q tests/test_ptdt_v35_master_engine.py tests/test_clearance_analyzer.py tests/test_mtls_provisioner.py tests/test_evidence_packaging.py

  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Resolve and install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
